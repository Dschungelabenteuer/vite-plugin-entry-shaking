name: Verify
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup pnpm
        uses: ./.github/actions/install

      - name: Lint code (oxlint)
        run: pnpm lint

  format:
    name: Format (oxfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup pnpm
        uses: ./.github/actions/install

      - name: Check formatting (oxfmt)
        run: pnpm exec oxfmt --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup pnpm
        uses: ./.github/actions/install

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup pnpm
        uses: ./.github/actions/install

      - name: Run tests (vitest)
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup pnpm
        uses: ./.github/actions/install

      - name: Build packages
        run: pnpm build
