name: Verify
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install node & pnpm dependencies
        uses: ./.github/actions/install

      - name: Lint code (oxlint)
        run: pnpm lint

  format:
    name: Format (oxfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install node & pnpm dependencies
        uses: ./.github/actions/install

      - name: Check formatting (oxfmt)
        run: pnpm exec oxfmt --check .

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install node & pnpm dependencies
        uses: ./.github/actions/install

      - name: Run tests (vitest)
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install node & pnpm dependencies
        uses: ./.github/actions/install

      - name: Build packages
        run: pnpm build
